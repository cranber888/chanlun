<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缠论分析系统</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>缠论分析</h2>
            </div>

            <!-- 搜索 -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索股票/指数..." autocomplete="off">
                <div id="searchResults" class="search-results hidden"></div>
            </div>

            <!-- 自选股 -->
            <div class="watchlist-section">
                <h3>自选股</h3>
                <div id="watchlist" class="watchlist"></div>
            </div>

            <!-- 笔规则设置 -->
            <div class="settings-section">
                <h3>笔规则设置</h3>
                <div class="settings-panel">
                    <label class="setting-row">
                        <span>严格笔</span>
                        <input type="checkbox" id="cfgBiStrict" checked>
                    </label>
                    <label class="setting-row">
                        <span>分型检查</span>
                        <select id="cfgBiFxCheck">
                            <option value="strict" selected>严格</option>
                            <option value="loss">宽松</option>
                            <option value="half">半严格</option>
                            <option value="totally">完全</option>
                        </select>
                    </label>
                    <label class="setting-row">
                        <span>缺口算K线</span>
                        <input type="checkbox" id="cfgGapAsKl">
                    </label>
                    <label class="setting-row">
                        <span>笔尾极值</span>
                        <input type="checkbox" id="cfgBiEndIsPeak" checked>
                    </label>
                    <label class="setting-row">
                        <span>允许次高低</span>
                        <input type="checkbox" id="cfgBiAllowSubPeak" checked>
                    </label>
                </div>
            </div>
        </aside>

        <main id="main">
            <!-- 顶部工具栏 -->
            <div id="toolbar">
                <div class="stock-info">
                    <span id="stockTitle">请选择股票</span>
                </div>
                <div class="period-selector" id="periodSelector"></div>
                <div class="toolbar-actions">
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleBi" checked> 笔
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleSeg" checked> 线段
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleZS" checked> 中枢
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleBSP" checked> 买卖点
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleMA" checked> MA
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleBOLL"> BOLL
                    </label>
                </div>
            </div>

            <!-- 图表区域 -->
            <div id="chartContainer">
                <div id="chart"></div>
                <div id="macdChart"></div>
            </div>

            <!-- 加载状态 -->
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <span>正在分析...</span>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js?v=2"></script>
</body>
</html>
