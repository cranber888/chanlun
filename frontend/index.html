<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缠论分析系统</title>
    <link rel="stylesheet" href="/static/css/style.css?v=10">
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>缠论分析</h2>
            </div>

            <!-- 搜索 -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索股票/指数..." autocomplete="off">
                <div id="searchResults" class="search-results hidden"></div>
            </div>

            <!-- 自选股 -->
            <div class="watchlist-section">
                <h3>自选股</h3>
                <div id="watchlist" class="watchlist"></div>
            </div>

            <!-- 笔规则设置 -->
            <div class="settings-section">
                <h3>笔规则设置</h3>
                <div class="settings-panel">
                    <label class="setting-row">
                        <span>严格笔</span>
                        <input type="checkbox" id="cfgBiStrict" checked>
                    </label>
                    <label class="setting-row">
                        <span>分型检查</span>
                        <select id="cfgBiFxCheck">
                            <option value="strict" selected>严格</option>
                            <option value="loss">宽松</option>
                            <option value="half">半严格</option>
                            <option value="totally">完全</option>
                        </select>
                    </label>
                    <label class="setting-row">
                        <span>缺口算K线</span>
                        <input type="checkbox" id="cfgGapAsKl">
                    </label>
                    <label class="setting-row">
                        <span>笔尾极值</span>
                        <input type="checkbox" id="cfgBiEndIsPeak" checked>
                    </label>
                    <label class="setting-row">
                        <span>允许次高低</span>
                        <input type="checkbox" id="cfgBiAllowSubPeak" checked>
                    </label>
                </div>
            </div>

            <!-- 中枢规则设置 -->
            <div class="settings-section">
                <h3>中枢规则设置</h3>
                <div class="settings-panel">
                    <label class="setting-row">
                        <span>最大笔数</span>
                        <select id="cfgZsMaxBiCnt">
                            <option value="0">不限</option>
                            <option value="5">5笔</option>
                            <option value="7" selected>7笔</option>
                            <option value="9">9笔</option>
                            <option value="11">11笔</option>
                        </select>
                    </label>
                </div>
            </div>

            <!-- 模拟回测 -->
            <div class="settings-section">
                <h3>模拟回测</h3>
                <div class="settings-panel">
                    <label class="setting-row">
                        <span>初始资金</span>
                        <select id="cfgCapital">
                            <option value="50000">5万</option>
                            <option value="100000" selected>10万</option>
                            <option value="200000">20万</option>
                            <option value="500000">50万</option>
                        </select>
                    </label>
                    <label class="setting-row">
                        <span>仓位比例</span>
                        <select id="cfgPosition">
                            <option value="0.5">50%</option>
                            <option value="0.8">80%</option>
                            <option value="1.0" selected>100%</option>
                        </select>
                    </label>
                    <label class="setting-row">
                        <span>买入信号</span>
                        <select id="cfgBuyType">
                            <option value="1" selected>1类买点</option>
                            <option value="1,2">1+2类买点</option>
                            <option value="1,2,3a">1+2+3A买点</option>
                            <option value="1,2,3a,3b">全部买点</option>
                        </select>
                    </label>
                    <label class="setting-row">
                        <span>卖出信号</span>
                        <select id="cfgSellType">
                            <option value="1" selected>1类卖点</option>
                            <option value="1,2">1+2类卖点</option>
                            <option value="1,2,3a">1+2+3A卖点</option>
                            <option value="1,2,3a,3b">全部卖点</option>
                        </select>
                    </label>
                    <label class="setting-row">
                        <span>止损比例</span>
                        <select id="cfgStopLoss">
                            <option value="0" selected>不止损</option>
                            <option value="0.03">3%</option>
                            <option value="0.05">5%</option>
                            <option value="0.08">8%</option>
                            <option value="0.10">10%</option>
                        </select>
                    </label>
                    <button id="btnRunBacktest" class="backtest-btn">开始回测</button>
                </div>
            </div>
        </aside>

        <main id="main">
            <!-- 顶部工具栏 -->
            <div id="toolbar">
                <div class="stock-info">
                    <span id="stockTitle">请选择股票</span>
                    <button id="refreshBtn" class="refresh-btn" title="刷新数据">&#x21bb;</button>
                    <label class="toggle-label auto-refresh-label">
                        <input type="checkbox" id="toggleAutoRefresh"> <span id="autoRefreshLabel">自动</span>
                    </label>
                </div>
                <div class="period-selector" id="periodSelector"></div>
                <div class="toolbar-actions">
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleMergedKL" checked> <span style="color:#FFD54F">合并K线</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleBi" checked> 笔
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleSeg" checked> 线段
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleZS" checked> 中枢
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleBSP" checked> 买卖点
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleMA" checked> MA
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleBOLL"> BOLL
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleBiTrend" checked> <span style="color:#AB47BC">笔走势</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleSegSeg" checked> <span style="color:#4CAF50">走势</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleSegZS" checked> <span style="color:#4CAF50">高级中枢</span>
                    </label>
                </div>
            </div>

            <!-- 图表区域 -->
            <div id="chartContainer">
                <div id="chart"></div>
                <div id="volumeChart"></div>
                <div id="macdChart"></div>
            </div>

            <!-- 回测结果面板 -->
            <div id="backtestPanel" class="hidden">
                <div class="backtest-header">
                    <h3>回测结果</h3>
                    <button id="btnCloseBacktest" class="close-btn">&times;</button>
                </div>
                <div id="backtestSummary" class="backtest-summary"></div>
                <div id="backtestEquity"></div>
                <div id="backtestTrades" class="backtest-trades"></div>
            </div>

            <!-- 加载状态 -->
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <span>正在分析...</span>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js?v=10"></script>
</body>
</html>
